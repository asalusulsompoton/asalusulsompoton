<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teater 3D — Asal Usul Sompoton</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F8F4EA;
      --forest: #173325;
      --forest-mid: #28523C;
      --sage: #516E5E;
      --gold: #DCA028;
      --gold-soft: #F7E8C2;
      --gourd: #BA5A28;

      --glass-tint: rgba(255, 253, 248, 0.86);
      --glass-strong: rgba(255, 253, 248, 0.94);
      --glass-border: rgba(255, 255, 255, 0.86);
      --glass-stroke: rgba(23, 51, 37, 0.11);
      --specular: inset 0 1.5px 1px rgba(255, 255, 255, 0.9), inset 0 -1px 2px rgba(23, 51, 37, 0.05);
      --shadow-glass: 0 12px 28px -8px rgba(23, 51, 37, 0.14), 0 4px 10px rgba(23, 51, 37, 0.05);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      /* Warna Suasana Dinamik (berubah mengikut babak) */
      --orb-a: rgba(247, 224, 168, 0.56);
      --orb-b: rgba(169, 214, 229, 0.5);
    }

    body.mood-forest { --orb-a: rgba(145, 206, 170, 0.52); --orb-b: rgba(190, 226, 204, 0.5); }
    body.mood-magic  { --orb-a: rgba(116, 218, 179, 0.52); --orb-b: rgba(244, 214, 134, 0.52); }
    body.mood-climax { --orb-a: rgba(247, 202, 114, 0.62); --orb-b: rgba(232, 166, 128, 0.42); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, #C7E3ED 0%, #E7F2F0 42%, var(--paper) 100%);
      color: var(--forest);
      height: 100vh; height: 100dvh; width: 100%;
      display: flex; flex-direction: column; overflow: hidden; position: relative;
      user-select: none; -webkit-user-select: none;
    }

    /* JEDA ANIMASI LATAR SEMASA INTERAKSI 3D (60 FPS) */
    body.interacting-3d .v-orb,
    body.interacting-3d .bg-note {
      animation-play-state: paused !important;
    }

    /* PENUNJUK MUATAN 3D RINGAN (TIADA GAMBAR 2D) */
    .mv-loader {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--gold-soft); font-size: 2rem;
    }
    .mv-loader span { animation: pulse3DLoad 1.2s ease-in-out infinite alternate; }
    @keyframes pulse3DLoad { from { opacity: 0.35; transform: scale(0.92); } to { opacity: 0.92; transform: scale(1.08); } }

    /* BAR KEMAJUAN CERITA (1-12) DI PALING ATAS */
    #story-progress {
      position: fixed; top: 0; left: 0; height: 3.5px; width: 100%; z-index: 1500;
      background: rgba(23, 51, 37, 0.08);
    }
    #story-progress-fill {
      height: 100%; width: 8.33%;
      background: linear-gradient(90deg, var(--forest-mid), var(--gold), var(--gourd));
      transition: width 0.35s var(--spring);
    }

    /* LATAR AMBIENT DINAMIK, NOT MUZIK TERAPUNG & TENUNAN LINANGKIT */
    .v-orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
      transition: background 0.8s ease; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      animation: orbDrift 20s ease-in-out infinite alternate;
    }
    .vo-1 { width: 440px; height: 440px; top: -120px; right: -120px; background: radial-gradient(circle, var(--orb-a) 0%, transparent 70%); }
    .vo-2 { width: 400px; height: 400px; bottom: -100px; left: -110px; background: radial-gradient(circle, var(--orb-b) 0%, transparent 70%); animation-delay: -6s; }
    @keyframes orbDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(18px, 14px, 0); } }

    .music-notes-bg { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .bg-note {
      position: absolute; bottom: -40px; left: var(--x);
      font-size: var(--sz); color: rgba(23, 51, 37, 0.085); font-weight: 700;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      animation: bgNoteDrift var(--dur) linear var(--del) infinite;
    }
    .bg-note.gold { color: rgba(220, 160, 40, 0.15); }
    @keyframes bgNoteDrift {
      0% { transform: translate3d(0, 0, 0) rotate(-10deg); opacity: 0; }
      14% { opacity: 1; }
      85% { opacity: 0.9; }
      100% { transform: translate3d(22px, -110vh, 0) rotate(14deg); opacity: 0; }
    }

    .viewer-linangkit {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg width='56' height='56' viewBox='0 0 56 56' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M28 0L56 28L28 56L0 28Z' fill='none' stroke='%23173325' stroke-width='0.9'/%3E%3Cpath d='M28 12L44 28L28 44L12 28Z' fill='none' stroke='%23BA5A28' stroke-width='0.7'/%3E%3Ccircle cx='28' cy='28' r='2' fill='%23DCA028'/%3E%3C/svg%3E");
      background-size: 56px 56px;
    }

    .bg-mountains {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 34vh;
      pointer-events: none; z-index: 0; opacity: 0.78;
    }

    /* BAR ATAS (TINTED GLASS RINGAN) */
    .top-bar {
      position: relative; z-index: 20;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      padding: max(12px, env(safe-area-inset-top)) 14px 6px;
    }
    .left-tools, .right-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .icon-btn {
      width: 39px; height: 39px; border-radius: 50%; flex-shrink: 0;
      background: var(--glass-strong); color: var(--forest); text-decoration: none;
      border: 1px solid var(--glass-border); display: grid; place-items: center;
      font-size: 1.15rem; cursor: pointer;
      box-shadow: var(--shadow-glass), var(--specular);
      transition: transform 0.2s var(--spring), border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover { border-color: var(--gold); background: #fff; }
    .icon-btn:active { transform: scale(0.88); }
    .icon-btn.muted { opacity: 0.45; }

    .page-pill {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      background: var(--glass-strong); padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--glass-border); font-size: 0.8rem; font-weight: 700;
      color: var(--forest);
      box-shadow: var(--shadow-glass), var(--specular);
    }
    .page-pill strong { color: var(--gourd); font-family: 'Fraunces', serif; font-size: 0.96rem; }
    .badge-3d-live {
      display: none; background: linear-gradient(135deg, var(--gourd), var(--gold));
      color: #fff; font-size: 0.62rem; font-weight: 800; padding: 2px 7px; border-radius: 999px;
    }

    /* iOS SEGMENTED CONTROL BAHASA */
    .lang-pills {
      display: flex; background: rgba(23, 51, 37, 0.08);
      border-radius: 999px; padding: 3px;
      box-shadow: inset 0 1px 3px rgba(23, 51, 37, 0.08);
    }
    .lang-pill {
      border: none; background: transparent; color: var(--sage);
      padding: 5px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 800;
      cursor: pointer; transition: 0.2s;
    }
    .lang-pill.active {
      background: #fff; color: var(--forest);
      box-shadow: 0 2px 8px rgba(23, 51, 37, 0.14);
    }

    .ar-jump {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: linear-gradient(135deg, #2A5840 0%, #173325 100%);
      color: #FAF5EB; text-decoration: none; font-weight: 700; font-size: 0.76rem;
      padding: 8px 14px; border-radius: 999px; white-space: nowrap;
      box-shadow: 0 8px 20px rgba(23, 51, 37, 0.24), inset 0 1px 1px rgba(255,255,255,0.26);
      transition: transform 0.2s var(--spring);
    }
    .ar-jump:active { transform: scale(0.92); }

    /* PENTAS UTAMA */
    .stage {
      position: relative; z-index: 10; flex: 1; min-height: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 4px 14px 6px; gap: 9px;
    }

    /* Bingkai Diorama 3D (Hal. 4, 6 & 10) */
    .exhibit-frame {
      position: relative; width: 100%; max-width: 780px; flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center; border-radius: 28px;
      background: radial-gradient(circle at 50% 56%, #285C42 0%, #0E2218 100%);
      border: 2.5px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 22px 48px -12px rgba(23, 51, 37, 0.26), inset 0 1px 1px rgba(255,255,255,0.25);
      overflow: hidden;
      transition: opacity 0.2s ease, transform 0.24s var(--spring), background 0.45s ease;
    }
    .exhibit-frame.night-stage {
      background: radial-gradient(circle at 50% 52%, #1B3945 0%, #07131A 100%);
    }
    .exhibit-frame::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; z-index: 8;
      background: repeating-linear-gradient(135deg, var(--forest) 0 8px, var(--gold) 8px 13px, var(--gourd) 13px 18px, var(--forest) 18px 24px);
    }
    .exhibit-frame::after {
      content: ""; position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
      width: 68%; height: 68px; border-radius: 50%; pointer-events: none; z-index: 1;
      background: radial-gradient(circle, rgba(244, 196, 83, 0.34), transparent 72%);
    }
    .exhibit-frame.switching { opacity: 0.3; transform: scale(0.98); }

    /* Bingkai Fit Ngam-Ngam untuk Gambar 2D */
    .exhibit-frame.mode-2d {
      flex: 0 1 auto;
      width: fit-content; height: fit-content;
      max-width: 94%; max-height: 45dvh;
      border-radius: 22px; background: transparent;
      border: 3px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 40px -8px rgba(23, 51, 37, 0.22);
    }
    .exhibit-frame.mode-2d::before,
    .exhibit-frame.mode-2d::after { display: none; }

    model-viewer { width: 100%; height: 100%; display: none; position: relative; z-index: 2; --poster-color: transparent; }

    .tools-3d {
      position: absolute; top: 12px; right: 12px; z-index: 6;
      display: none; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 90%;
    }
    .mini-3d-btn {
      background: var(--glass-strong); color: var(--forest);
      border: 1px solid var(--glass-border); border-radius: 999px;
      padding: 6px 11px; font-size: 0.69rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2), var(--specular);
      transition: transform 0.18s var(--spring), background 0.2s;
    }
    .mini-3d-btn:active { transform: scale(0.9); }
    .mini-3d-btn.active { background: var(--gold); color: var(--forest); border-color: var(--gold-soft); }

    .stage-3d-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
      display: none; pointer-events: none;
      background: rgba(13, 34, 24, 0.78); color: var(--gold-soft);
      border: 1px solid rgba(247, 232, 194, 0.26);
      font-size: 0.68rem; font-weight: 700; padding: 5px 13px; border-radius: 999px;
      white-space: nowrap; transition: opacity 0.4s ease;
    }
    .stage-3d-hint.faded { opacity: 0; }

    .art-wrap {
      display: none; position: relative; z-index: 2;
      max-height: 100%; max-width: 100%; overflow: hidden;
    }
    .art-wrap::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.28) 50%, transparent 65%);
      transform: translateX(-140%);
      animation: pageSheen 6s ease-in-out infinite;
    }
    @keyframes pageSheen { 0%, 72% { transform: translateX(-140%); } 100% { transform: translateX(140%); } }
    #img-stage {
      max-height: 44dvh; max-width: 100%; height: auto; width: auto;
      display: block; object-fit: contain;
    }

    /* TAJUK & KAD SARI KATA TINTED GLASS BERJALUR LINANGKIT */
    .caption-area { width: 100%; max-width: 720px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .chapter-kicker {
      font-size: 0.66rem; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--gourd);
    }
    .scene-caption {
      font-family: 'Fraunces', serif; font-size: clamp(1.02rem, 3.8vw, 1.38rem);
      color: var(--forest); font-weight: 800; line-height: 1.18; letter-spacing: -0.015em;
    }
    .subtitle-card {
      position: relative; overflow: hidden;
      width: 100%; background: var(--glass-tint); border: 1.5px solid var(--glass-border);
      border-radius: 22px; padding: 12px 16px 10px;
      box-shadow: var(--shadow-glass), var(--specular);
      transition: border-color 0.25s ease;
    }
    .subtitle-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3.5px;
      background: repeating-linear-gradient(135deg, var(--forest) 0 8px, var(--gold) 8px 13px, var(--gourd) 13px 18px, var(--forest) 18px 24px);
    }
    .subtitle-card.playing { border-color: rgba(220, 160, 40, 0.72); }
    .sub-meta { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px; }
    .sub-lang-tag {
      background: var(--gold-soft); color: var(--gourd);
      font-size: 0.64rem; font-weight: 800; padding: 2px 9px; border-radius: 999px;
    }
    .sub-eq { display: flex; gap: 2.5px; align-items: flex-end; height: 10px; opacity: 0.25; }
    .sub-eq span { width: 2.5px; height: 4px; background: var(--forest-mid); border-radius: 2px; }
    .subtitle-card.playing .sub-eq { opacity: 1; }
    .subtitle-card.playing .sub-eq span { animation: eqBounce 0.55s ease-in-out infinite alternate; }
    .subtitle-card.playing .sub-eq span:nth-child(2) { animation-delay: 0.15s; }
    .subtitle-card.playing .sub-eq span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes eqBounce { from { height: 3px; } to { height: 10px; } }
    #viewer-sub {
      font-size: clamp(0.84rem, 3vw, 0.98rem); color: #2B4537; line-height: 1.48; font-weight: 600;
      animation: subFade 0.25s ease;
    }
    @keyframes subFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .quiz-cta-pill {
      display: none; margin-top: 8px;
      background: linear-gradient(135deg, var(--gold), var(--gourd));
      color: #fff; text-decoration: none; font-size: 0.76rem; font-weight: 800;
      padding: 7px 16px; border-radius: 999px;
      box-shadow: 0 6px 18px rgba(186, 90, 40, 0.3);
      animation: popUp 0.4s var(--spring);
    }
    @keyframes popUp { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

    /* DOK KAWALAN BAWAH */
    .bottom-dock {
      position: relative; z-index: 20;
      padding: 4px 14px max(12px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .audio-bar-wrap { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px; }
    .time-txt { font-size: 0.68rem; color: var(--sage); font-weight: 700; min-width: 30px; text-align: center; }
    .progress-track { flex: 1; height: 6px; background: rgba(23, 51, 37, 0.12); border-radius: 999px; cursor: pointer; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--forest-mid), var(--gold), var(--gourd)); transition: width 0.1s linear; }

    .num-bar {
      display: flex; gap: 6px; justify-content: center;
      background: var(--glass-tint); padding: 6px 11px; border-radius: 999px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glass), var(--specular);
    }
    .num-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--glass-stroke);
      background: rgba(255, 255, 255, 0.9); color: var(--sage);
      font-weight: 700; font-size: 0.76rem; cursor: pointer; position: relative;
      transition: transform 0.18s var(--spring), background 0.2s, color 0.2s;
    }
    .num-btn:active { transform: scale(0.86); }
    .num-btn.has-3d { border-color: rgba(220, 160, 40, 0.7); color: var(--gourd); }
    .num-btn.has-3d::after { content: ""; position: absolute; top: -2px; right: -1px; width: 6px; height: 6px; border-radius: 50%; background: var(--gourd); }
    .num-btn.active {
      background: linear-gradient(135deg, #2A5840, #173325); color: #FAF5EB;
      border-color: var(--forest); font-weight: 800; transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(23, 51, 37, 0.28);
    }

    .player-row { display: flex; align-items: center; gap: 12px; }
    .play-main {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #2A5840 0%, #173325 100%);
      color: #FAF5EB; font-size: 1.2rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 10px 24px rgba(23, 51, 37, 0.28), inset 0 1px 1px rgba(255,255,255,0.28);
      transition: transform 0.2s var(--spring);
    }
    .play-main:active { transform: scale(0.9); }
    .play-main.playing { animation: pulsePlay 1.8s infinite; }
    @keyframes pulsePlay { 0%, 100% { box-shadow: 0 0 0 0 rgba(220, 160, 40, 0.55); } 50% { box-shadow: 0 0 0 10px rgba(220, 160, 40, 0); } }
    .auto-btn {
      padding: 9px 14px; border-radius: 999px; background: var(--glass-strong);
      border: 1px solid var(--glass-border); color: var(--forest);
      font-size: 0.74rem; font-weight: 700; cursor: pointer;
      box-shadow: var(--shadow-glass), var(--specular);
      transition: transform 0.18s var(--spring), background 0.2s;
    }
    .auto-btn:active { transform: scale(0.92); }
    .auto-btn.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gourd); }

    #toast {
      position: fixed; top: 62px; left: 50%; transform: translate(-50%, -10px);
      z-index: 1600; opacity: 0; pointer-events: none;
      background: linear-gradient(135deg, #173325, #28523C); color: #FAF5EB;
      border: 1.5px solid var(--gold);
      border-radius: 999px; padding: 7px 16px; font-size: 0.74rem; font-weight: 700;
      box-shadow: 0 10px 24px rgba(23, 51, 37, 0.25);
      transition: opacity 0.22s ease, transform 0.22s var(--spring); white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #flash-overlay { position: fixed; inset: 0; background: #fff; z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .confetti { position: fixed; width: 9px; height: 9px; z-index: 2500; pointer-events: none; animation: confettiDrop 2.4s ease-out forwards; }
    @keyframes confettiDrop { 0% { transform: translate3d(0,-20px,0) rotate(0deg); opacity: 1; } 100% { transform: translate3d(0,100vh,0) rotate(720deg); opacity: 0; } }

    /* Blur hanya diaktifkan pada desktop/laptop supaya telefon kekal 60 FPS */
    @media (min-width: 769px) {
      .icon-btn, .page-pill, .subtitle-card, .num-bar, .auto-btn, .mini-3d-btn {
        backdrop-filter: blur(14px) saturate(155%);
        -webkit-backdrop-filter: blur(14px) saturate(155%);
      }
    }
    @media (max-width: 600px) {
      .ar-jump span { display: none; }
      .ar-jump { width: 36px; height: 36px; padding: 0; }
      .icon-btn { width: 36px; height: 36px; font-size: 1.05rem; }
      .page-pill { padding: 5px 11px; font-size: 0.74rem; }
      .lang-pill { padding: 4px 7px; font-size: 0.68rem; }
      .mini-3d-btn { padding: 5px 9px; font-size: 0.65rem; }
      .bg-note:nth-child(n+4) { display: none; }
      .num-bar {
        display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
        border-radius: 22px; padding: 8px 12px; width: 100%; max-width: 305px; justify-items: center;
      }
      .num-btn { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>

  <div id="story-progress"><div id="story-progress-fill"></div></div>
  <div id="flash-overlay"></div>

  <div class="v-orb vo-1"></div>
  <div class="v-orb vo-2"></div>
  <div class="music-notes-bg" aria-hidden="true">
    <span class="bg-note" style="--x:9%; --dur:21s; --del:0s; --sz:1.45rem;">♪</span>
    <span class="bg-note gold" style="--x:28%; --dur:25s; --del:-6s; --sz:1.85rem;">♫</span>
    <span class="bg-note" style="--x:54%; --dur:19s; --del:-11s; --sz:1.35rem;">♩</span>
    <span class="bg-note gold" style="--x:76%; --dur:24s; --del:-3s; --sz:1.7rem;">♬</span>
    <span class="bg-note" style="--x:90%; --dur:22s; --del:-14s; --sz:1.5rem;">♪</span>
  </div>
  <div class="viewer-linangkit"></div>
  <svg class="bg-mountains" viewBox="0 0 1440 320" preserveAspectRatio="none">
    <path fill="#C1DCE0" d="M0,320 L0,210 L180,165 L340,195 L520,95 L640,125 L740,55 L830,90 L940,130 L1180,105 L1440,175 L1440,320 Z"/>
    <path fill="#DCE8D5" d="M0,320 L0,245 Q360,190 720,235 T1440,220 L1440,320 Z"/>
  </svg>

  <div id="toast"></div>

  <div class="top-bar">
    <div class="left-tools">
      <a href="index.html" class="icon-btn" title="Kembali ke Pameran">‹</a>

  <script>
    const isMobile = window.innerWidth <= 768;

    /* ================= ENJIN BUNYI UI HALUS (WEB AUDIO API) ================= */
    let uiCtx = null;
    function playChime(type = 'flip') {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!uiCtx && AC) uiCtx = new AC();
        if (!uiCtx) return;
        const run = () => {
          const now = uiCtx.currentTime;
          if (type === 'flip') {
            const o = uiCtx.createOscillator(), g = uiCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(520, now); o.frequency.exponentialRampToValueAtTime(760, now + 0.07);
            g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.1, now + 0.015); g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            o.connect(g); g.connect(uiCtx.destination); o.start(now); o.stop(now + 0.15);
          } else if (type === 'fanfare') {
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
              const o = uiCtx.createOscillator(), g = uiCtx.createGain();
              o.type = 'triangle'; o.frequency.setValueAtTime(f, now + i * 0.1);
              g.gain.setValueAtTime(0.001, now + i * 0.1); g.gain.exponentialRampToValueAtTime(0.16, now + i * 0.1 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
              o.connect(g); g.connect(uiCtx.destination); o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.55);
            });
          }
        };
        if (uiCtx.state === 'suspended') uiCtx.resume().then(run).catch(() => {});
        else run();
      } catch (e) {}
    }

    const subtitles = {
      pg1: { bm: "Pada zaman dahulu di Sabah, tinggal sepasang suami isteri warga emas yang penyayang bernama Aki dan Odu.", en: "Long ago in Sabah, lived a loving elderly couple named Aki and Odu.", kdz: "Di gulu po id Sabah, poingion o misawa tongotuo roitan do Aki om Odu." },
      pg2: { bm: "Dahulu, Odu mempunyai suara nyanyian yang sangat merdu, namun akibat demam panas yang teruk, dia telah kehilangan keupayaan bercakap dan bernyanyi.", en: "Odu used to have a beautiful singing voice, but a severe fever took away her ability to speak and sing.", kdz: "Kivaa rolou di tosonong i Odu do sinding, nga sabab do ruminit di topuod, naawi o koonuon disido do moboros om sinding." },
      pg3: { bm: "Didorong oleh rasa rindu untuk mendengar suara isterinya semula, Aki bertekad mencari penawar dengan menggalas wakid dan melangkah masuk ke dalam hutan tebal.", en: "Driven by the longing to hear his wife's voice again, Aki was determined to find a cure by carrying his wakid and stepping into the dense forest.", kdz: "Nokoongoi do langad mokinongou rolou di sawo, minaganu i Aki kootuson mogihum panawar miampai mibobohos do wakid mongoi id talun." },
      pg4: { bm: "Semasa meredah hutan, mereka terjumpa sebatang anak sungai yang alirannya tersekat oleh longgokan dahan kayu patah.", en: "While trekking through the forest, they found a small stream whose flow was blocked by a pile of broken wooden branches.", kdz: "Id ralan, nokoruba yolo bawang di noolob do roun om poring di norumbak." },
      pg5: { bm: "Mereka segera bekerjasama mengalihkan dahan-dahan tersebut bagi membantu seekor anak rusa dan burung kecil yang kehausan.", en: "They quickly worked together to move the branches to help a thirsty fawn and a little bird.", kdz: "Miampai mibobohos, minomogos yolo di roun monguhup do payau om tombolog di nansad." },
      pg6: { bm: "Sebagai tanda terima kasih, burung kecil itu terbang membimbing mereka jauh ke dalam kawasan hutan magis.", en: "As a token of gratitude, the little bird flew to guide them deep into the magical forest area.", kdz: "Ponongkounsikou, tombolog di ogingo minonguhup diyolo mongoi id roun do talun." },
      pg7: { bm: "Mereka dibimbing ke sebuah rimbunan pokok buluh yang menghasilkan alunan melodi menenangkan apabila ditiup angin.", en: "They were guided to a bamboo grove that produced a soothing melody when blown by the wind.", kdz: "Minonguhup i tombolog diyolo mongoi id poring di ogingo, minomonsoi do sinding di tosonong." },
      pg8: { bm: "Mendengar alunan merdu itu, Aki mendapat ilham lalu mengutip labu kering dan batang buluh yang gugur di atas tanah.", en: "Hearing the sweet melody, Aki got an inspiration and picked up a dried gourd and bamboo stalks that fell on the ground.", kdz: "Nokinongou do sinding, minomili i Aki do labu om poring di norumbak motok mongilag do puun di poimpasi." },
      pg9: { bm: "Di rumah, percubaan pertama Aki gagal kerana bunyinya sumbang, lalu Odu segera membantu mengikat paip buluh pada labu menggunakan bilah rotan dan lilin lebah.", en: "At home, Aki's first attempt failed because it sounded out of tune, so Odu quickly helped bind the bamboo pipes to the gourd using rattan strips and beeswax.", kdz: "Id walai, minumbal i Aki momonsoi nga sumbang, minonguhup i Odu momoguno kabaalan monganyam popioput di poring id labu momoguno tuai om lilin do potizukan." },
      pg10: { bm: "Aki meniup alat yang telah siap itu, dan alunan melodi ajaibnya meresap ke jiwa Odu, memulihkan suaranya dalam satu detik keajaiban sehingga dia menyebut perkataan pertamanya: \"Aki!\"", en: "Aki blew the finished instrument, and its magical melody seeped into Odu's soul, miraculously restoring her voice as she uttered her first word: \"Aki!\"", kdz: "Piniamung di Aki o kakamot sinding dii. Nakaralom i Odu do sinding, mongirak isido om nokoboros no: \"Aki!\"" },
      pg11: { bm: "Dengan gembira, Odu kembali menyanyi mengikut alunan muzik itu, dan suara merdunya bergema hingga didengari oleh seluruh penduduk kampung.", en: "Joyfully, Odu sang again along with the music, and her beautiful voice echoed until it was heard by all the villagers.", kdz: "Miampai kounsikaan, sinding kawagu i Odu miampai di muzik, om rolou disido di tosonong norongou do toinsanan tulun id kampung." },
      pg12: { bm: "Alat muzik ciptaan bersama itu kemudiannya dinamakan sebagai Sompoton, menjadi lambang cinta sejati mereka, dan mereka terus hidup bahagia buat selama-lamanya.", en: "The jointly created musical instrument was then named Sompoton, becoming a symbol of their true love, and they lived happily ever after.", kdz: "Kakamot sinding di piniamung monsoi roitan do Sompoton, nokosiliu lambang do tupus diyolo, om poingion yolo id koposizon di ounsikou." }
    };

    const sfxList = { 1: "./sfx/pg1_kampung.mp3", 4: "./sfx/pg4_sungai.mp3", 6: "./sfx/pg6_burung.mp3", 7: "./sfx/pg7_angin_buluh.mp3", 10: "./sfx/pg10_sompoton.mp3" };
    const pages = [
      { n: 1, tag: "BABAK 01 · KAMPUNG DAMAI", mood: "", t: "Kehidupan Harmoni Aki & Odu", glb: null },
      { n: 2, tag: "BABAK 02 · DUGAAN", mood: "", t: "Dugaan Kehilangan Suara Odu", glb: null },
      { n: 3, tag: "BABAK 03 · PENGEMBARAAN", mood: "mood-forest", t: "Misi Mencari Penawar di Hutan", glb: null },
      { n: 4, tag: "BABAK 04 · DIORAMA 3D", mood: "mood-forest", t: "Aliran Anak Sungai Tersekat", glb: "./models/page4.glb" },
      { n: 5, tag: "BABAK 05 · KEBAIKAN", mood: "mood-forest", t: "Kebaikan Membawa Rahmat", glb: null },
      { n: 6, tag: "BABAK 06 · DIORAMA 3D", mood: "mood-magic", t: "Petunjuk ke Hutan Magis", glb: "./models/page6.glb" },
      { n: 7, tag: "BABAK 07 · ALUNAN BULUH", mood: "mood-magic", t: "Alunan Melodi Rimbunan Buluh", glb: null },
      { n: 8, tag: "BABAK 08 · ILHAM ALAM", mood: "mood-magic", t: "Ilham Daripada Alam", glb: null },
      { n: 9, tag: "BABAK 09 · CIPTAAN BERSAMA", mood: "mood-climax", t: "Kerjasama Menghasilkan Sompoton", glb: null },
      { n: 10, tag: "BABAK 10 · KEMUNCAK 3D", mood: "mood-climax", t: "Melodi Ajaib Memulihkan Suara", glb: "./models/page10.glb" },
      { n: 11, tag: "BABAK 11 · KEGEMBIRAAN", mood: "mood-climax", t: "Nyanyian Odu Bergema", glb: null },
      { n: 12, tag: "BABAK 12 · WARISAN ABADI", mood: "mood-climax", t: "Sompoton, Simbol Cinta Sejati", glb: null }
    ];

    const params = new URLSearchParams(window.location.search);
    let currentPage = Math.min(Math.max(parseInt(params.get('page')) || 4, 1), 12);
    let currentLang = ['bm', 'en', 'kdz'].includes(params.get('lang')) ? params.get('lang') : 'bm';

    const mv = document.getElementById('mv');
    const artWrap = document.getElementById('art-wrap'), imgStage = document.getElementById('img-stage');
    const exhibitFrame = document.getElementById('exhibit-frame'), tools3D = document.getElementById('tools-3d');
    const badge3D = document.getElementById('badge-3d'), playBtn = document.getElementById('play-btn');
    const sfxBtn = document.getElementById('sfx-btn'), numBar = document.getElementById('num-bar');
    const viewerSub = document.getElementById('viewer-sub'), subCard = document.getElementById('subtitle-card');
    const subLangTag = document.getElementById('sub-lang-tag'), arJumpLink = document.getElementById('ar-jump-link');
    const progressFill = document.getElementById('progress-fill'), timeCurr = document.getElementById('time-curr'), timeDur = document.getElementById('time-dur');
    const storyProgFill = document.getElementById('story-progress-fill'), chapterKicker = document.getElementById('chapter-kicker');
    const stage3dHint = document.getElementById('stage-3d-hint'), quizCtaPill = document.getElementById('quiz-cta-pill');
    const toastEl = document.getElementById('toast');

    if (!isMobile) mv.setAttribute('shadow-intensity', '0.5');

    let audio = new Audio(), sfxAudio = new Audio(), sfxEnabled = true, autoStory = false, toastTimer = null, isNightStage = false;

    /* ================= MAINKAN SEMUA ANIMASI 3D SERENTAK (SEPERTI AR KAMERA) ================= */
    function playAllAnimations(mvEl) {
      try {
        const sceneSym = Object.getOwnPropertySymbols(mvEl).find(s => s.description === 'scene');
        const scene = sceneSym ? mvEl[sceneSym] : null;
        if (!scene || !scene.mixer) return;
        const clips = scene.animationsByName
          ? Array.from(scene.animationsByName.values())
          : (scene.currentGLTF && scene.currentGLTF.animations ? scene.currentGLTF.animations : []);
        clips.forEach(clip => {
          const action = scene.mixer.clipAction(clip);
          if (action) {
            action.enabled = true;
            action.setEffectiveWeight(1);
            action.play();
          }
        });
      } catch (e) {}
    }

    mv.addEventListener('load', () => {
      if (typeof mv.play === 'function') mv.play();
      requestAnimationFrame(() => playAllAnimations(mv));
      setTimeout(() => playAllAnimations(mv), 180);
    });

    ['touchstart', 'pointerdown'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (sfxEnabled && sfxList[currentPage] && sfxAudio.paused && audio.paused) {
          sfxAudio.play().catch(() => {});
        }
      }, { once: true, passive: true });
    });

    // Jeda animasi latar semasa pengguna memutar/zum 3D untuk FPS penuh
    mv.addEventListener('pointerdown', () => {
      stage3dHint.classList.add('faded');
      document.body.classList.add('interacting-3d');
    });
    window.addEventListener('pointerup', () => document.body.classList.remove('interacting-3d'), { passive: true });
    window.addEventListener('pointercancel', () => document.body.classList.remove('interacting-3d'), { passive: true });

    function showToast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400); }
    function fmtTime(sec) { if (!sec || isNaN(sec)) return "0:00"; return `${Math.floor(sec / 60)}:${Math.floor(sec % 60).toString().padStart(2, '0')}`; }

    pages.forEach(p => {
      const b = document.createElement('button');
      b.className = 'num-btn' + (p.glb ? ' has-3d' : '');
      b.textContent = p.n;
      b.onclick = () => { playChime('flip'); loadPage(p.n, false); };
      numBar.appendChild(b);
    });

    function updateLangUI() {
      document.querySelectorAll('.lang-pill').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
      subLangTag.textContent = currentLang.toUpperCase();
      arJumpLink.href = `ar.html?lang=${currentLang}`;
    }

    function playPageSfx(num) {
      sfxAudio.pause(); sfxAudio.currentTime = 0;
      if (sfxEnabled && sfxList[num]) { sfxAudio.src = sfxList[num]; sfxAudio.loop = true; sfxAudio.volume = 0.42; sfxAudio.play().catch(() => {}); }
      sfxBtn.style.display = sfxList[num] ? 'grid' : 'none';
    }
    function toggleSfxPref() {
      sfxEnabled = !sfxEnabled;
      sfxBtn.classList.toggle('muted', !sfxEnabled); sfxBtn.textContent = sfxEnabled ? '🎵' : '🔇';
      if (sfxEnabled && audio.paused) playPageSfx(currentPage); else sfxAudio.pause();
      showToast(sfxEnabled ? "🎵 Smart SFX dihidupkan" : "🔇 Smart SFX dimatikan");
    }
    function toggleRotate() {
      const btn = document.getElementById('rot-btn');
      if (mv.hasAttribute('auto-rotate')) { mv.removeAttribute('auto-rotate'); btn.classList.remove('active'); }
      else { mv.setAttribute('auto-rotate', ''); btn.classList.add('active'); }
    }
    function toggleStageMood() {
      isNightStage = !isNightStage;
      const btn = document.getElementById('mood-btn');
      exhibitFrame.classList.toggle('night-stage', isNightStage);
      mv.exposure = isNightStage ? 0.9 : 1.15;
      btn.classList.toggle('active', isNightStage);
      btn.textContent = isNightStage ? '☀️ Pagi' : '🌙 Magis';
      playChime('flip');
      showToast(isNightStage ? "🌙 Pencahayaan Magis aktif" : "☀️ Pencahayaan Pagi aktif");
    }
    function resetCamera() { mv.cameraOrbit = '35deg 68deg 108%'; mv.fieldOfView = 'auto'; playChime('flip'); showToast("🎯 Kamera 3D ditetapkan semula"); }

    function snap3D() {
      try {
        const flash = document.getElementById('flash-overlay');
        flash.style.opacity = '0.85'; setTimeout(() => flash.style.opacity = '0', 180);
        const dataUrl = mv.toDataURL('image/png');
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
          const ctx = c.getContext('2d');
          const bg = ctx.createRadialGradient(c.width/2, c.height/2, 40, c.width/2, c.height/2, c.width*0.7);
          bg.addColorStop(0, isNightStage ? '#1B3945' : '#285C42');
          bg.addColorStop(1, isNightStage ? '#07131A' : '#0E2218');
          ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0);

          ctx.strokeStyle = '#173325'; ctx.lineWidth = Math.max(8, c.width * 0.012);
          ctx.strokeRect(5, 5, c.width - 10, c.height - 10);
          ctx.strokeStyle = '#DCA028'; ctx.lineWidth = Math.max(3, c.width * 0.005);
          ctx.strokeRect(14, 14, c.width - 28, c.height - 28);

          ctx.fillStyle = 'rgba(23, 51, 37, 0.92)'; ctx.fillRect(0, c.height - 54, c.width, 54);
          ctx.fillStyle = '#FFE8A3'; ctx.font = `bold ${Math.max(14, Math.round(c.width * 0.022))}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(`✦ Asal Usul Sompoton · Halaman ${currentPage} (Diorama 3D)`, c.width / 2, c.height - 20);
          const a = document.createElement('a');
          a.download = `Diorama3D_Sompoton_Hal${currentPage}.png`;
          a.href = c.toDataURL('image/png'); a.click();
          showToast("📸 Foto 3D berjaya disimpan!");
        };
        img.src = dataUrl;
      } catch (e) { showToast("⚠ Tangkapan foto tidak disokong pelayar ini"); }
    }

    function launchConfetti() {
      const colors = ['#DCA028', '#BA5A28', '#28523C', '#F7E8C2', '#4ADE80'];
      const count = isMobile ? 22 : 36;
      for (let i = 0; i < count; i++) {
        const c = document.createElement('div'); c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw'; c.style.top = '-12px';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
        document.body.appendChild(c); setTimeout(() => c.remove(), 2900);
      }
    }

    function loadPage(num, autoPlayNow = false) {
      currentPage = num; stopAudio();
      exhibitFrame.classList.add('switching');
      setTimeout(() => {
        const data = pages[num - 1];
        document.body.className = data.mood;
        storyProgFill.style.width = `${(num / 12) * 100}%`;
        document.getElementById('curr-num').textContent = num;
        chapterKicker.textContent = data.tag;
        document.getElementById('caption').textContent = data.t;
        viewerSub.textContent = subtitles[`pg${num}`][currentLang];
        quizCtaPill.style.display = num === 12 ? 'inline-block' : 'none';
        updateLangUI();
        document.querySelectorAll('.num-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === num));

        if (data.glb) {
          exhibitFrame.classList.remove('mode-2d');
          mv.removeAttribute('poster');
          if (mv.getAttribute('src') !== data.glb) mv.setAttribute('src', data.glb);
          mv.style.display = 'block'; artWrap.style.display = 'none';
          tools3D.style.display = 'flex'; badge3D.style.display = 'inline-block';
          stage3dHint.style.display = 'block'; stage3dHint.classList.remove('faded');
          if (typeof mv.play === 'function') mv.play();
          setTimeout(() => playAllAnimations(mv), 150);
        } else {
          // Bebaskan memori GPU 3D apabila beralih ke halaman 2D (elak lag & restart)
          if (typeof mv.pause === 'function') mv.pause();
          if (mv.getAttribute('src')) mv.removeAttribute('src');
          mv.style.display = 'none'; tools3D.style.display = 'none'; badge3D.style.display = 'none';
          stage3dHint.style.display = 'none';
          exhibitFrame.classList.add('mode-2d');
          imgStage.src = `./images/page${num}.jpg`; imgStage.onerror = () => { imgStage.src = './images/cover.jpg'; };
          artWrap.style.display = 'block';
        }
        exhibitFrame.classList.remove('switching');
        playPageSfx(num);
        if (autoPlayNow) startAudioPlayback();
      }, 140);
    }

    function stepPage(delta) {
      playChime('flip');
      let next = currentPage + delta;
      if (next < 1) next = 12;
      if (next > 12) next = 1;
      loadPage(next, autoStory);
    }

    function changeLang(lang) {
      playChime('flip');
      currentLang = lang; updateLangUI();
      viewerSub.textContent = subtitles[`pg${currentPage}`][lang];
      if (!audio.paused) { stopAudio(); startAudioPlayback(); }
    }

    function startAudioPlayback() {
      if (!sfxAudio.paused) sfxAudio.pause();
      audio.src = `./audio/pg${currentPage}_${currentLang}.mp3`;
      audio.play().then(() => { playBtn.textContent = '❚❚'; playBtn.classList.add('playing'); subCard.classList.add('playing'); })
        .catch(() => showToast("⚠ Fail audio tidak ditemui."));
    }
    function toggleAudio() {
      if (!audio.paused) {
        audio.pause(); playBtn.textContent = '▶'; playBtn.classList.remove('playing'); subCard.classList.remove('playing');
        if (sfxEnabled && sfxList[currentPage]) sfxAudio.play().catch(() => {});
      } else startAudioPlayback();
    }
    function stopAudio() {
      audio.pause(); audio.currentTime = 0; playBtn.textContent = '▶';
      playBtn.classList.remove('playing'); subCard.classList.remove('playing');
      progressFill.style.width = '0%'; timeCurr.textContent = '0:00'; timeDur.textContent = '0:00';
    }
    function toggleAutoStory() {
      playChime('flip');
      autoStory = !autoStory;
      const btn = document.getElementById('auto-story-btn');
      btn.classList.toggle('on', autoStory); btn.textContent = autoStory ? '✨ Auto: ON' : '✨ Auto-Cerita';
      showToast(autoStory ? "✨ Mod Auto-Cerita aktif" : "Mod Auto-Cerita dimatikan");
      if (autoStory && audio.paused) startAudioPlayback();
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        timeCurr.textContent = fmtTime(audio.currentTime); timeDur.textContent = fmtTime(audio.duration);
      }
    });
    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶'; playBtn.classList.remove('playing'); subCard.classList.remove('playing');
      if (currentPage === 12) {
        launchConfetti(); playChime('fanfare');
        showToast("🎉 Tahniah! Anda selesai meneroka kisah Sompoton");
        if (autoStory) { autoStory = false; document.getElementById('auto-story-btn').classList.remove('on'); document.getElementById('auto-story-btn').textContent = '✨ Auto-Cerita'; }
      } else if (autoStory && currentPage < 12) {
        setTimeout(() => loadPage(currentPage + 1, true), 900);
      } else if (sfxEnabled && sfxList[currentPage]) {
        sfxAudio.play().catch(() => {});
      }
    });

    function seekAudio(e) { if (!audio.duration) return; const r = e.currentTarget.getBoundingClientRect(); audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration; }

    /* LERET JARI (SWIPE) UNTUK SELA HALAMAN 2D DI TELEFON */
    let touchStartX = 0;
    artWrap.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    artWrap.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 48) stepPage(diff < 0 ? 1 : -1);
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') stepPage(1);
      else if (e.key === 'ArrowLeft') stepPage(-1);
      else if (e.code === 'Space') { e.preventDefault(); toggleAudio(); }
    });

    // Jeda audio & 3D apabila pengguna keluar/tukar tab
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (!audio.paused) toggleAudio();
        sfxAudio.pause();
        if (typeof mv.pause === 'function') mv.pause();
      } else if (mv.getAttribute('src')) {
        if (typeof mv.play === 'function') mv.play();
        playAllAnimations(mv);
      }
    });

    updateLangUI();
    loadPage(currentPage, false);
  </script>
</body>
</html>

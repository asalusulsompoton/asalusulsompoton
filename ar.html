<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Imbas AR — Asal Usul Sompoton</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #F8F4EA;
      --forest: #173325;
      --forest-mid: #28523C;
      --sage: #516E5E;
      --gold: #DCA028;
      --gold-bright: #F4C453;
      --gold-soft: #F7E8C2;
      --gourd: #BA5A28;

      --glass-tint: rgba(255, 253, 248, 0.9);
      --glass-strong: rgba(255, 253, 248, 0.95);
      --glass-border: rgba(255, 255, 255, 0.88);
      --glass-stroke: rgba(23, 51, 37, 0.12);
      --specular: inset 0 1px 1px rgba(255, 255, 255, 0.9);
      --shadow-glass: 0 10px 24px -8px rgba(23, 51, 37, 0.15), 0 4px 10px rgba(23, 51, 37, 0.05);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      touch-action: none;
      background: transparent !important;
      width: 100%; height: 100%;
    }

    /* Sembunyikan skrin loading & butang Enter VR/AR lalai A-Frame */
    .a-loader-title,
    .a-enter-vr,
    .a-enter-vr-button,
    .a-enter-ar,
    .a-enter-ar-button { display: none !important; }

    /* BUTANG KEMBALI */
    .back-circle {
      position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 2200;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--glass-strong); color: var(--forest); text-decoration: none;
      border: 1px solid var(--glass-border);
      display: grid; place-items: center; font-size: 1.45rem; line-height: 1;
      box-shadow: var(--shadow-glass), var(--specular);
      transition: transform 0.18s ease;
    }
    .back-circle:active { transform: scale(0.92); }

    /* ================= SKRIN PERSEDIAAN MULA (RINGAN & STATIK) ================= */
    #start-screen {
      position: fixed; inset: 0; z-index: 2000;
      background: linear-gradient(180deg, #C7E3ED 0%, #E7F2F0 44%, var(--paper) 100%);
      color: var(--forest); display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: max(54px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      text-align: center; overflow-y: auto;
      transition: opacity 0.32s ease;
    }
    #start-screen.fade-out { opacity: 0; pointer-events: none; }

    .start-backdrop {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(circle at 88% 12%, rgba(247, 224, 168, 0.45) 0%, transparent 45%),
        radial-gradient(circle at 12% 88%, rgba(173, 212, 185, 0.4) 0%, transparent 45%);
    }

    .start-linangkit {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg width='56' height='56' viewBox='0 0 56 56' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M28 0L56 28L28 56L0 28Z' fill='none' stroke='%23173325' stroke-width='0.9'/%3E%3Cpath d='M28 12L44 28L28 44L12 28Z' fill='none' stroke='%23BA5A28' stroke-width='0.7'/%3E%3Ccircle cx='28' cy='28' r='2' fill='%23DCA028'/%3E%3C/svg%3E");
      background-size: 56px 56px;
    }

    .start-mountains {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 32vh;
      pointer-events: none; z-index: 0; opacity: 0.82;
    }

    .start-card {
      position: relative; z-index: 2; width: 100%; max-width: 375px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* PENTAS KULIT BUKU RINGAN */
    .cover-stage {
      position: relative; padding: 16px 26px; border-radius: 28px; margin-bottom: 14px;
      background: linear-gradient(145deg, rgba(255, 253, 248, 0.86), rgba(231, 243, 245, 0.7));
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow-glass), var(--specular);
      display: grid; place-items: center;
    }
    .cover-frame {
      position: relative; width: 114px; border-radius: 6px 15px 15px 6px; overflow: hidden;
      box-shadow: -8px 14px 26px rgba(23, 51, 37, 0.22), 0 0 0 2px #fff;
      animation: floatCover 5s ease-in-out infinite;
    }
    @keyframes floatCover {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-1.5deg); }
      50% { transform: translate3d(0, -5px, 0) rotate(0.5deg); }
    }
    .start-cover { width: 100%; height: auto; display: block; }

    .mini-sticker {
      position: absolute; z-index: 4; pointer-events: none;
      background: #FFFDF8; border: 1px solid #fff;
      padding: 4px 10px; border-radius: 999px; font-size: 0.62rem; font-weight: 800;
      box-shadow: 0 6px 14px rgba(23, 51, 37, 0.12);
    }
    .ms-1 { top: 10px; right: -12px; color: var(--gourd); }
    .ms-2 { bottom: 12px; left: -14px; background: var(--forest); color: var(--gold-soft); border-color: rgba(255,255,255,0.22); }

    .kicker-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(247, 232, 194, 0.88); border: 1px solid rgba(220, 160, 40, 0.35);
      color: var(--gourd); font-size: 0.65rem; font-weight: 800; letter-spacing: 1.6px;
      text-transform: uppercase; padding: 5px 14px; border-radius: 999px; margin-bottom: 8px;
    }
    #start-screen h1 {
      font-family: 'Fraunces', serif; font-size: clamp(1.7rem, 6.5vw, 2.15rem); line-height: 1.08;
      color: var(--forest); font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em;
    }
    .start-sub { font-size: 0.84rem; color: var(--sage); font-weight: 600; margin-bottom: 14px; }

    .lang-label {
      font-size: 0.66rem; letter-spacing: 1.4px; text-transform: uppercase;
      color: var(--sage); font-weight: 800; margin-bottom: 6px;
    }
    .lang-pills {
      display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center;
      background: rgba(23, 51, 37, 0.08); padding: 4px; border-radius: 999px;
    }
    .lang-pill {
      padding: 7px 13px; border-radius: 999px; border: none;
      background: transparent; color: var(--sage); font-weight: 700; font-size: 0.76rem;
      cursor: pointer; transition: 0.2s;
    }
    .lang-pill.active {
      background: #fff; color: var(--forest);
      box-shadow: 0 2px 8px rgba(23, 51, 37, 0.14);
    }

    #cam-error-box {
      display: none; width: 100%; max-width: 325px; margin-bottom: 12px;
      background: rgba(254, 226, 226, 0.96); border: 1px solid #EF4444;
      color: #7F1D1D; font-size: 0.77rem; line-height: 1.45;
      padding: 10px 14px; border-radius: 16px; text-align: left;
    }

    .btn-scan {
      width: 100%; max-width: 325px; padding: 14px 18px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, #2A5840 0%, #173325 100%);
      color: #FAF5EB; font-weight: 700; font-size: 0.94rem;
      cursor: pointer; margin-bottom: 10px;
      box-shadow: 0 10px 24px rgba(23, 51, 37, 0.24);
      transition: transform 0.18s ease;
    }
    .btn-scan:disabled { opacity: 0.7; cursor: wait; }
    .btn-scan:active { transform: scale(0.96); }

    .btn-3d-alt {
      width: 100%; max-width: 325px; padding: 11px; border-radius: 999px;
      border: 1px solid var(--glass-border); background: var(--glass-strong);
      color: var(--forest); text-decoration: none; font-weight: 700; font-size: 0.83rem;
      display: block; margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(23, 51, 37, 0.08);
      transition: transform 0.18s ease;
    }
    .btn-3d-alt:active { transform: scale(0.96); }

    .tips-grid {
      width: 100%; max-width: 325px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .tip-chip {
      background: var(--glass-tint);
      border: 1px solid var(--glass-border); border-radius: 16px; padding: 10px 6px;
      box-shadow: 0 4px 12px rgba(23, 51, 37, 0.06);
    }
    .tip-chip span { display: block; font-size: 1.15rem; margin-bottom: 3px; }
    .tip-chip strong { display: block; font-size: 0.65rem; color: var(--forest); line-height: 1.25; }

    /* ================= BINGKAI PENGIMBAS AR RINGAN ================= */
    #scan-frame {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(68vw, 250px); height: min(68vw, 250px); z-index: 900; pointer-events: none; display: none;
    }
    .corner {
      position: absolute; width: 34px; height: 34px; border-color: var(--gold-bright); border-style: solid;
    }
    .tl { top: 0; left: 0; border-width: 3.5px 0 0 3.5px; border-radius: 14px 0 0 0; }
    .tr { top: 0; right: 0; border-width: 3.5px 3.5px 0 0; border-radius: 0 14px 0 0; }
    .bl { bottom: 0; left: 0; border-width: 0 0 3.5px 3.5px; border-radius: 0 0 0 14px; }
    .br { bottom: 0; right: 0; border-width: 0 3.5px 3.5px 0; border-radius: 0 0 14px 0; }
    .scan-line {
      position: absolute; left: 12px; right: 12px; height: 2.5px; border-radius: 99px;
      background: linear-gradient(90deg, transparent, #FFF4C2, var(--gold-bright), transparent);
      animation: scanMove 2.4s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%, 100% { transform: translate3d(0, 14px, 0); opacity: 0.55; }
      50% { transform: translate3d(0, 222px, 0); opacity: 1; }
    }
    .scan-caption {
      position: absolute; bottom: -44px; left: 50%; transform: translateX(-50%);
      background: var(--glass-strong); color: var(--forest);
      font-size: 0.68rem; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase;
      padding: 6px 15px; border-radius: 999px; border: 1.5px solid var(--glass-border);
      white-space: nowrap; box-shadow: var(--shadow-glass);
    }

    /* ================= HUD KAMERA (RINGAN UNTUK FPS TINGGI) ================= */
    #top-controls {
      position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 1000;
      display: none; align-items: center; gap: 6px;
      background: var(--glass-strong); padding: 4px 6px; border-radius: 999px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
    }
    #lang-select {
      background: var(--gold-soft); color: var(--forest);
      border: none; border-radius: 999px;
      padding: 6px 10px; font-weight: 800; font-size: 0.76rem; outline: none;
    }
    #lang-select option { background: #F8F4EA; color: #173325; }
    .hud-btn {
      width: 35px; height: 35px; border-radius: 50%;
      background: #fff; color: var(--forest);
      border: 1px solid var(--glass-stroke); font-size: 0.95rem;
      display: grid; place-items: center; cursor: pointer;
      transition: transform 0.15s ease;
    }
    .hud-btn:active { transform: scale(0.9); }
    #reset-btn { display: none; }

    #page-indicator {
      position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 54px); left: 50%; transform: translateX(-50%);
      z-index: 999; display: none; align-items: center; gap: 8px;
      max-width: 92vw; background: var(--glass-strong); color: var(--forest);
      padding: 7px 15px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: border-color 0.2s ease;
    }
    #page-indicator.locked-pill { border-color: var(--gold); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--gold);
    }
    .status-dot.locked { background: #22C55E; box-shadow: 0 0 0 3px rgba(34, 197, 91, 0.25); }

    #ar-toast {
      position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 98px); left: 50%; transform: translate(-50%, -10px);
      z-index: 1500; opacity: 0; pointer-events: none;
      background: linear-gradient(135deg, #173325, #28523C); color: #FAF5EB;
      border: 1.5px solid var(--gold);
      border-radius: 999px; padding: 7px 16px; font-size: 0.74rem; font-weight: 700; white-space: nowrap;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #ar-toast.show { opacity: 1; transform: translate(-50%, 0); }

    #subtitle-box {
      position: fixed; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 92px); left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 520px; z-index: 998; display: none; overflow: hidden;
      background: var(--glass-strong); color: var(--forest);
      border: 1.5px solid var(--glass-border); border-radius: 22px;
      padding: 13px 16px 12px; text-align: center;
      box-shadow: var(--shadow-glass);
    }
    #subtitle-box::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: repeating-linear-gradient(135deg, var(--forest) 0 8px, var(--gold) 8px 13px, var(--gourd) 13px 18px, var(--forest) 18px 24px);
    }
    .sub-head { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    #subtitle-lang {
      background: var(--gold-soft); color: var(--gourd);
      font-size: 0.66rem; font-weight: 800; padding: 2px 9px; border-radius: 999px;
    }
    .sub-eq { display: flex; gap: 2.5px; align-items: flex-end; height: 11px; }
    .sub-eq span { width: 2.5px; height: 4px; background: var(--forest-mid); border-radius: 2px; animation: eqSub 0.55s ease-in-out infinite alternate; }
    .sub-eq span:nth-child(2) { animation-delay: 0.15s; }
    .sub-eq span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes eqSub { from { height: 3px; } to { height: 11px; } }
    #subtitle-text { font-size: 0.86rem; line-height: 1.48; font-weight: 600; color: #274133; }

    #ui-container {
      position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      z-index: 999; display: none; gap: 8px; align-items: center;
      background: var(--glass-strong); padding: 8px 12px; border-radius: 999px;
      border: 1.5px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
    }
    .img-btn {
      background: transparent; border: 2px solid transparent; border-radius: 50%;
      padding: 2px; cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s;
    }
    .img-btn img { width: 50px; height: auto; display: block; border-radius: 50%; }
    .img-btn:active { transform: scale(0.9); }
    .img-btn.active-lang {
      border-color: var(--gold);
      transform: translateY(-2px) scale(1.04);
    }

    #flash-overlay { position: fixed; inset: 0; background: #fff; z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
  </style>
</head>
<body>

  <a href="index.html" class="back-circle" title="Kembali ke Pameran">‹</a>

  <!-- SKRIN MULA (RINGAN TANPA ANIMASI LATAR BERAT) -->
  <div id="start-screen">
    <div class="start-backdrop"></div>
    <div class="start-linangkit"></div>
    <svg class="start-mountains" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#C1DCE0" d="M0,320 L0,210 L180,165 L340,195 L520,95 L640,125 L740,55 L830,90 L940,130 L1180,105 L1440,175 L1440,320 Z"/>
      <path fill="#DCE8D5" d="M0,320 L0,245 Q360,190 720,235 T1440,220 L1440,320 Z"/>
    </svg>

    <div class="start-card">
      <div class="cover-stage">
        <span class="mini-sticker ms-1">✨ WebAR 3D</span>
        <span class="mini-sticker ms-2">🎧 3 Bahasa</span>
        <div class="cover-frame">
          <img src="./images/cover.jpg" alt="Kulit Buku Asal Usul Sompoton" class="start-cover" />
        </div>
      </div>

      <span class="kicker-pill">✦ WebAR Interaktif · Kumpulan 13</span>
      <h1>Asal Usul Sompoton</h1>
      <p class="start-sub">Lagenda Warisan Borneo • 12 Halaman AR</p>

      <div class="lang-label">Pilih Bahasa Penceritaan</div>
      <div class="lang-pills">
        <button class="lang-pill" data-lang="en" onclick="selectStartLang('en', this)">English</button>
        <button class="lang-pill active" data-lang="bm" onclick="selectStartLang('bm', this)">Bahasa Melayu</button>
        <button class="lang-pill" data-lang="kdz" onclick="selectStartLang('kdz', this)">Kadazandusun</button>
      </div>

      <div id="cam-error-box"></div>

      <button class="btn-scan" id="start-ar-btn" onclick="startAR()">📷 Mula Imbas Buku (AR)</button>
      <a href="viewer.html?page=4" class="btn-3d-alt">🧊 Tiada buku? Teroka Mod 3D</a>

      <div class="tips-grid">
        <div class="tip-chip"><span>📷</span><strong>Tekan Allow Kamera</strong></div>
        <div class="tip-chip"><span>☀️</span><strong>Cahaya Terang</strong></div>
        <div class="tip-chip"><span>👆</span><strong>Putar & Zum 3D</strong></div>
      </div>
    </div>
  </div>

  <!-- BINGKAI SCANNER -->
  <div id="scan-frame">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="scan-line"></div>
    <div class="scan-caption">✦ Halakan ke Halaman 1 – 12</div>
  </div>

  <!-- KAWALAN ATAS -->
  <div id="top-controls">
    <select id="lang-select" onchange="changeActiveLang(this.value)">
      <option value="bm">BM</option>
      <option value="en">EN</option>
      <option value="kdz">KDZ</option>
    </select>
    <button id="reset-btn" class="hud-btn" onclick="resetModelTransform()" title="Tetap Semula 3D">↺</button>
    <button id="snap-btn" class="hud-btn" onclick="takeSnapshot()" title="Tangkap Gambar AR">📸</button>
    <button id="mute-btn" class="hud-btn" onclick="stopAudio()" title="Hentikan Audio">🔊</button>
  </div>

  <div id="page-indicator">
    <span class="status-dot" id="status-dot"></span>
    <span id="page-title-text">Halakan kamera ke mana-mana halaman buku</span>
  </div>

  <div id="ar-toast"></div>
  <div id="flash-overlay"></div>

  <div id="subtitle-box">
    <div class="sub-head">
      <span id="subtitle-lang">BM</span>
      <div class="sub-eq"><span></span><span></span><span></span></div>
    </div>
    <div id="subtitle-text"></div>
  </div>

  <div id="ui-container">
    <button class="img-btn" data-btn-lang="bm" onclick="playAudio('bm')"><img src="./ui/btn_bm.png" alt="BM" /></button>
    <button class="img-btn" data-btn-lang="en" onclick="playAudio('en')"><img src="./ui/btn_en.png" alt="EN" /></button>
    <button class="img-btn" data-btn-lang="kdz" onclick="playAudio('kdz')"><img src="./ui/btn_kdz.png" alt="KDZ" /></button>
    <button class="img-btn" onclick="stopAudio()"><img src="./ui/btn_stop.png" alt="Stop" /></button>
  </div>

  <!-- BABAK WEBAR (ANTI "AW, SNAP!": preserveDrawingBuffer: false + MAKS 1 MODEL 3D DALAM VRAM) -->
  <a-scene
    loading-screen="enabled: false"
    mindar-image="imageTargetSrc: ./asalusulsompoton.mind; autoStart: false; maxTrack: 1; uiScanning: no; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5;"
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true; antialias: false; precision: mediump; powerPreference: default; preserveDrawingBuffer: false;"
    vr-mode-ui="enabled: false"
    xr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.2" position="1 2 2"></a-light>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-pg1" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="target-pg2" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="target-pg3" mindar-image-target="targetIndex: 2"></a-entity>

    <!-- Model 3D hanya dimuat bila halaman diimbas (elak lonjakan memori RAM telefon) -->
    <a-entity id="target-pg4" mindar-image-target="targetIndex: 3">
      <a-entity id="gltf-pg4" data-src="./models/page4.glb" position="0 -0.15 0.05" rotation="0 0 0" scale="0.015 0.015 0.015"></a-entity>
    </a-entity>

    <a-entity id="target-pg5" mindar-image-target="targetIndex: 4"></a-entity>

    <a-entity id="target-pg6" mindar-image-target="targetIndex: 5">
      <a-entity id="gltf-pg6" data-src="./models/page6.glb" position="0 -0.15 0.05" rotation="0 0 0" scale="0.18 0.18 0.18"></a-entity>
    </a-entity>

    <a-entity id="target-pg7" mindar-image-target="targetIndex: 6"></a-entity>
    <a-entity id="target-pg8" mindar-image-target="targetIndex: 7"></a-entity>
    <a-entity id="target-pg9" mindar-image-target="targetIndex: 8"></a-entity>

    <a-entity id="target-pg10" mindar-image-target="targetIndex: 9">

    /* ================= ENJIN BUNYI UI HALUS (WEB AUDIO API) ================= */
    let uiCtx = null;
    function playUiChime(type = 'flip') {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!uiCtx && AC) uiCtx = new AC();
        if (!uiCtx) return;
        const run = () => {
          const now = uiCtx.currentTime;
          if (type === 'flip') {
            const o = uiCtx.createOscillator(), g = uiCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(520, now); o.frequency.exponentialRampToValueAtTime(760, now + 0.07);
            g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(0.1, now + 0.015); g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            o.connect(g); g.connect(uiCtx.destination); o.start(now); o.stop(now + 0.15);
          } else if (type === 'found') {
            [523.25, 659.25].forEach((f, i) => {
              const o = uiCtx.createOscillator(), g = uiCtx.createGain();
              o.type = 'triangle'; o.frequency.setValueAtTime(f, now + i * 0.08);
              g.gain.setValueAtTime(0.001, now + i * 0.08); g.gain.exponentialRampToValueAtTime(0.14, now + i * 0.08 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.24);
              o.connect(g); g.connect(uiCtx.destination); o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.26);
            });
          }
        };
        if (uiCtx.state === 'suspended') uiCtx.resume().then(run).catch(() => {});
        else run();
      } catch (e) {}
    }

    /* ================= TETAPAN SAIZ & PENGURUS MEMORI GPU 3D (ANTI "AW, SNAP!") ================= */
    const modelConfig = {
      pg4:  { scale: 0.015, posX: 0, posY: -0.15, posZ: 0.05, rotY: 0 },
      pg6:  { scale: 0.18,  posX: 0, posY: -0.15, posZ: 0.05, rotY: 0 },
      pg10: { scale: 0.015, posX: 0, posY: -0.15, posZ: 0.05, rotY: 90 }
    };

    function applyModelConfig(pageCode, modelEl) {
      const cfg = modelConfig[pageCode];
      if (!cfg || !modelEl) return;
      modelEl.object3D.position.set(cfg.posX, cfg.posY, cfg.posZ);
      modelEl.object3D.rotation.set(0, THREE.MathUtils.degToRad(cfg.rotY), 0);
      modelEl.object3D.scale.set(cfg.scale, cfg.scale, cfg.scale);
      modelEl.dataset.defaultScale = cfg.scale;
    }

    // Ringankan tekstur model 3D di telefon (jimat ~33% VRAM untuk elak "Aw, Snap!")
    function optimizeMeshForMobile(modelEl) {
      if (!isMobile || !modelEl) return;
      const mesh = modelEl.getObject3D('mesh');
      if (!mesh) return;
      mesh.traverse(node => {
        if (node.isMesh) {
          node.castShadow = false;
          node.receiveShadow = false;
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach(m => {
            if (!m) return;
            ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap'].forEach(k => {
              if (m[k]) {
                m[k].generateMipmaps = false;
                m[k].minFilter = THREE.LinearFilter;
                m[k].needsUpdate = true;
              }
            });
          });
        }
      });
    }

    // Bebaskan memori GPU & RAM model 3D lama sepenuhnya sebelum memuat model baharu
    function dispose3DModel(pageCode) {
      const el = document.getElementById(`gltf-${pageCode}`);
      if (!el) return;
      const mesh = el.getObject3D('mesh');
      if (mesh) {
        mesh.traverse(node => {
          if (node.isMesh) {
            if (node.geometry) node.geometry.dispose();
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach(m => {
              if (!m) return;
              ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap'].forEach(k => {
                if (m[k]) m[k].dispose();
              });
              m.dispose();
            });
          }
        });
        el.removeObject3D('mesh');
      }
      el.removeAttribute('animation-mixer');
      el.removeAttribute('gltf-model');
      if (window.THREE && THREE.Cache) THREE.Cache.clear();
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl && sceneEl.renderer && sceneEl.renderer.renderLists) {
        sceneEl.renderer.renderLists.dispose();
      }
    }

    function activate3DModel(pageCode, modelEl) {
      if (!modelEl) return;
      if (loaded3DPage && loaded3DPage !== pageCode) {
        dispose3DModel(loaded3DPage);
        loaded3DPage = null;
      }
      if (loaded3DPage !== pageCode) {
        showToast("⏳ Memuatkan diorama 3D...");
        modelEl.setAttribute('gltf-model', modelEl.dataset.src);
        modelEl.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 1');
        loaded3DPage = pageCode;
      } else {
        modelEl.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 1');
        showToast("✨ Diorama 3D aktif — Seret putar, cubit zum");
      }
    }

    ['pg4', 'pg6', 'pg10'].forEach(code => {
      const el = document.getElementById(`gltf-${code}`);
      if (!el) return;
      el.addEventListener('model-loaded', () => {
        applyModelConfig(code, el);
        optimizeMeshForMobile(el);
        if (currentPage === code) {
          el.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 1');
          showToast("✨ Diorama 3D aktif — Seret putar, cubit zum");
        }
      });
    });

    function resetModelTransform() {
      if (!activeModel || !currentPage) return;
      playUiChime('flip');
      applyModelConfig(currentPage, activeModel);
      showToast("↺ Kedudukan 3D ditetapkan semula");
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    function selectStartLang(lang, btn) {
      playUiChime('flip');
      selectedLang = lang; langSelect.value = lang;
      document.querySelectorAll('.lang-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function changeActiveLang(lang) {
      playUiChime('flip');
      selectedLang = lang;
      if (currentPage) playAudio(lang);
    }

    function unlockMobileAudio() {
      playUiChime('flip');
      [currentAudio, currentSfx].forEach(el => {
        el.muted = true;
        el.play().then(() => { el.pause(); el.muted = false; }).catch(() => { el.muted = false; });
      });
    }

    async function startAR() {
      unlockMobileAudio();
      camErrorBox.style.display = 'none';
      startArBtn.disabled = true;
      startArBtn.textContent = '⏳ Meminta akses kamera...';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        camErrorBox.innerHTML = '⚠️ Pelayar ini tidak menyokong akses kamera. Sila buka pautan menggunakan <strong>Safari (iPhone)</strong> atau <strong>Chrome (Android)</strong>.';
        camErrorBox.style.display = 'block';
        startArBtn.disabled = false;
        startArBtn.textContent = '📷 Mula Imbas Buku (AR)';
        return;
      }

      try {
        // Ujian kebenaran kamera guna resolusi kecil (jimat RAM semasa mula)
        const testStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        testStream.getTracks().forEach(track => track.stop());
      } catch (err) {
        camErrorBox.innerHTML = '⚠️ <strong>Akses kamera diperlukan untuk AR.</strong><br>Sila tekan <em>Benarkan / Allow</em>, atau buka Tetapan pelayar anda untuk mengaktifkan kebenaran kamera bagi laman ini.';
        camErrorBox.style.display = 'block';
        startArBtn.disabled = false;
        startArBtn.textContent = '📷 Cuba Semula Akses Kamera';
        return;
      }

      startArBtn.textContent = '✨ Membuka pengimbas AR...';
      const startScreen = document.getElementById('start-screen');
      startScreen.classList.add('fade-out');
      setTimeout(() => { startScreen.remove(); }, 340);

      document.getElementById('top-controls').style.display = 'flex';
      pageIndicator.style.display = 'flex';
      scanFrame.style.display = 'block';

      const sceneEl = document.querySelector('a-scene');
      const launch = () => {
        if (sceneEl.renderer) {
          // Kunci pixelRatio = 1 di telefon (potong penggunaan VRAM grafik sehingga 60%)
          sceneEl.renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
        }
        if (sceneEl.canvas) {
          sceneEl.canvas.addEventListener('webglcontextlost', e => {
            e.preventDefault();
            showToast("⚠️ Memori grafik penuh, sila muat semula");
          });
        }
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) arSystem.start();
      };
      if (sceneEl.hasLoaded) launch();
      else sceneEl.addEventListener('loaded', launch);
    }

    function setupTarget(elementId, modelId, pageCode, pageTitle) {
      const el = document.getElementById(elementId);
      el.addEventListener("targetFound", () => {
        currentPage = pageCode;
        activeModel = modelId ? document.getElementById(modelId) : null;
        uiContainer.style.display = "flex";
        scanFrame.style.display = "none";
        statusDot.classList.add('locked');
        pageIndicator.classList.add('locked-pill');
        pageTitleText.textContent = pageTitle;
        resetBtn.style.display = activeModel ? 'grid' : 'none';
        playUiChime('found');
        playSfx(pageCode);
        if (activeModel) activate3DModel(pageCode, activeModel);
      });
      el.addEventListener("targetLost", () => {
        if (activeModel) activeModel.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 0');
        currentPage = null; activeModel = null;
        uiContainer.style.display = "none";
        resetBtn.style.display = "none";
        scanFrame.style.display = "block";
        statusDot.classList.remove('locked');
        pageIndicator.classList.remove('locked-pill');
        pageTitleText.textContent = "Halakan kamera ke mana-mana halaman buku";
        stopAudio();
      });
    }

    setupTarget("target-pg1", null, "pg1", "Hal. 1 · Kehidupan Harmoni Aki & Odu");
    setupTarget("target-pg2", null, "pg2", "Hal. 2 · Dugaan Kehilangan Suara Odu");
    setupTarget("target-pg3", null, "pg3", "Hal. 3 · Misi Mencari Penawar di Hutan");

    setupTarget("target-pg5", null, "pg5", "Hal. 5 · Kebaikan Membawa Rahmat");
    setupTarget("target-pg6", "gltf-pg6", "pg6", "Hal. 6 · Petunjuk ke Hutan Magis (3D)");
    setupTarget("target-pg7", null, "pg7", "Hal. 7 · Alunan Melodi Rimbunan Buluh");
    setupTarget("target-pg8", null, "pg8", "Hal. 8 · Ilham Daripada Alam");
    setupTarget("target-pg9", null, "pg9", "Hal. 9 · Kerjasama Menghasilkan Sompoton");
    setupTarget("target-pg10", "gltf-pg10", "pg10", "Hal. 10 · Melodi Ajaib Sompoton (3D)");

    function playSfx(pageCode) {
      stopSfx();
      if (sfxList[pageCode]) {
        currentSfx.src = sfxList[pageCode]; currentSfx.loop = true; currentSfx.volume = 0.5;
        currentSfx.play().catch(() => {});
      }
    }
    function stopSfx() { currentSfx.pause(); currentSfx.currentTime = 0; }
    function clearActiveLangBtns() { document.querySelectorAll('.img-btn').forEach(b => b.classList.remove('active-lang')); }

    function playAudio(lang) {
      if (!currentPage) return;
      langSelect.value = lang;
      if (!currentSfx.paused) currentSfx.pause();
      currentAudio.pause(); currentAudio.currentTime = 0;

      clearActiveLangBtns();
      const activeBtn = document.querySelector(`.img-btn[data-btn-lang="${lang}"]`);
      if (activeBtn) activeBtn.classList.add('active-lang');

      if (subtitles[currentPage] && subtitles[currentPage][lang]) {
        document.getElementById('subtitle-lang').textContent = lang.toUpperCase();
        document.getElementById('subtitle-text').textContent = subtitles[currentPage][lang];
        document.getElementById('subtitle-box').style.display = 'block';
      }

      currentAudio.src = `./audio/${currentPage}_${lang}.mp3`;
      currentAudio.play().catch(() => {});
      currentAudio.onended = () => {
        clearActiveLangBtns();
        document.getElementById('subtitle-box').style.display = 'none';
        if (currentPage && sfxList[currentPage]) currentSfx.play().catch(() => {});
      };
    }

    function stopAudio() {
      currentAudio.pause(); currentAudio.currentTime = 0;
      clearActiveLangBtns();
      document.getElementById('subtitle-box').style.display = 'none';
      stopSfx();
    }

    function takeSnapshot() {
      const video = document.querySelector('video');
      const sceneEl = document.querySelector('a-scene');
      const aCanvas = sceneEl ? sceneEl.canvas : null;
      if (!video || !aCanvas) return;

      // Render bingkai 3D serta-merta sebelum tangkap gambar (kerana preserveDrawingBuffer: false)
      if (sceneEl.renderer && sceneEl.object3D && sceneEl.camera) {
        sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
      }

      const flash = document.getElementById('flash-overlay');
      flash.style.opacity = '0.85';
      setTimeout(() => flash.style.opacity = '0', 180);

      const out = document.createElement('canvas');
      out.width = window.innerWidth; out.height = window.innerHeight;
      const ctx = out.getContext('2d');

      const vRatio = video.videoWidth / video.videoHeight;
      const cRatio = out.width / out.height;
      let drawW = out.width, drawH = out.height, offsetX = 0, offsetY = 0;
      if (vRatio > cRatio) { drawW = out.height * vRatio; offsetX = (out.width - drawW) / 2; }
      else { drawH = out.width / vRatio; offsetY = (out.height - drawH) / 2; }
      ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
      ctx.drawImage(aCanvas, 0, 0, out.width, out.height);

      ctx.strokeStyle = "#173325"; ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, out.width - 10, out.height - 10);
      ctx.strokeStyle = "#DCA028"; ctx.lineWidth = 3;
      ctx.strokeRect(13, 13, out.width - 26, out.height - 26);

      ctx.fillStyle = "rgba(23, 51, 37, 0.92)"; ctx.fillRect(0, out.height - 50, out.width, 50);
      ctx.fillStyle = "#FFE8A3"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("✦ Asal Usul Sompoton • WebAR Storybook (Kumpulan 13 UMS)", out.width / 2, out.height - 20);

      const link = document.createElement('a');
      link.download = `AR_Sompoton_${currentPage || 'snapshot'}.png`;
      link.href = out.toDataURL('image/png');
      link.click();
      showToast("📸 Gambar AR berjaya disimpan!");
    }

    // Interaksi Sentuh 3D (Zum Dinamik Mengikut Saiz Model)
    let isDragging = false, prevX = 0, prevY = 0, initPinch = null, initScale = 1;
    window.addEventListener("mousedown", e => {
      if (!activeModel || e.target.closest("#ui-container") || e.target.closest("#top-controls")) return;
      isDragging = true; prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener("mousemove", e => {
      if (!isDragging || !activeModel) return;
      activeModel.object3D.rotation.y += (e.clientX - prevX) * 0.01;
      activeModel.object3D.rotation.x += (e.clientY - prevY) * 0.01;
      prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener("mouseup", () => isDragging = false);
    window.addEventListener("wheel", e => {
      if (!activeModel) return;
      const base = parseFloat(activeModel.dataset.defaultScale) || 0.015;
      const factor = e.deltaY > 0 ? 0.92 : 1.08;
      const s = Math.min(Math.max(activeModel.object3D.scale.x * factor, base * 0.35), base * 3.0);
      activeModel.object3D.scale.set(s, s, s);
    }, { passive: true });
    window.addEventListener("touchstart", e => {
      if (!activeModel || e.target.closest("#ui-container") || e.target.closest("#top-controls")) return;
      if (e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
      else if (e.touches.length === 2) { isDragging = false; initPinch = getDist(e.touches); initScale = activeModel.object3D.scale.x; }
    }, { passive: true });
    window.addEventListener("touchmove", e => {
      if (!activeModel) return;
      if (e.touches.length === 1 && isDragging) {
        activeModel.object3D.rotation.y += (e.touches[0].clientX - prevX) * 0.01;
        activeModel.object3D.rotation.x += (e.touches[0].clientY - prevY) * 0.01;
        prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initPinch) {
        const base = parseFloat(activeModel.dataset.defaultScale) || 0.015;
        let s = Math.min(Math.max(initScale * (getDist(e.touches) / initPinch), base * 0.35), base * 3.0);
        activeModel.object3D.scale.set(s, s, s);
      }
    }, { passive: true });
    window.addEventListener("touchend", () => { isDragging = false; initPinch = null; }, { passive: true });
    function getDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }

    // Jeda audio & animasi apabila pengguna tukar tab
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAudio();
        if (activeModel) activeModel.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 0');
      } else if (activeModel) {
        activeModel.setAttribute('animation-mixer', 'clip: *; loop: repeat; timeScale: 1');
      }
    });
  </script>
</body>
